<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGuard | Data Synthesizer</title>
    <style>
        body { font-family: 'JetBrains Mono', monospace; background: #09111f; color: #e2eaf5; padding: 2rem; max-width: 800px; margin: auto; line-height: 1.6; }
        h2 { color: #2af5c8; border-bottom: 1px solid #1e3a5f; padding-bottom: 10px; }
        label { display: block; font-size: 13px; color: #6b8aaa; margin-top: 15px; margin-bottom: 5px; }
        input { padding: 8px; width: 100%; box-sizing: border-box; background: #112240; color: white; border: 1px solid #1e3a5f; border-radius: 4px; font-family: inherit; }
        button { margin-top: 20px; padding: 10px; width: 100%; background: #2af5c8; color: #09111f; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        pre { background: #0d1a2e; padding: 15px; border: 1px solid #1e3a5f; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        #loading { display: none; color: #fbbf24; margin-top: 15px; font-size: 13px; }
        #result { display: none; margin-top: 25px; }
    </style>
</head>
<body>
    <h2>AgroGuard Architecture Demo</h2>
    <form id="synth-form">
        <label>Latitude</label>
        <input type="number" step="0.0001" id="lat" value="-1.2921" required>
        
        <label>Longitude</label>
        <input type="number" step="0.0001" id="lon" value="36.8219" required>
        
        <label>Land Acres (Optional)</label>
        <input type="number" step="0.01" id="acres">
        
        <label>Target Field Image (.jpg, .png, .webp)</label>
        <input type="file" id="image" accept="image/jpeg, image/png, image/webp" required>
        
        <button type="submit">Execute Synthesis Pipeline</button>
    </form>

    <div id="loading">Initiating asynchronous requests...</div>
    
    <div id="result">
        <h3 style="color: #a78bfa;">Pipeline Output</h3>
        <pre id="json-output"></pre>
    </div>

    <script>
        document.getElementById('synth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            const fd = new FormData();
            fd.append('lat', document.getElementById('lat').value);
            fd.append('lon', document.getElementById('lon').value);
            
            const acres = document.getElementById('acres').value;
            if (acres) fd.append('land_acres', acres);
            
            fd.append('image', document.getElementById('image').files[0]);

            try {
                const response = await fetch('/api/synthesize', { method: 'POST', body: fd });
                const data = await response.json();
                document.getElementById('json-output').textContent = JSON.stringify(data, null, 2);
                document.getElementById('result').style.display = 'block';
            } catch (err) {
                document.getElementById('json-output').textContent = 'Exception: ' + err;
                document.getElementById('result').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
